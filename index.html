/* --- css/base.css --- */
/* ==========================================================================
   VERITY BASE STYLES
   Reset · Font imports · Layout · Typography utilities · Accessibility
   ========================================================================== */

/* -----------------------------------------------------------------------
   GOOGLE FONTS
   ----------------------------------------------------------------------- */


/* -----------------------------------------------------------------------
   MODERN CSS RESET
   ----------------------------------------------------------------------- */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
}

body {
  background-color: var(--color-chalk);
  color: var(--color-ink);
  font-family: 'Inter', sans-serif;
  font-size: var(--body-md-font-size);
  font-weight: var(--body-md-font-weight);
  line-height: var(--body-md-line-height);
  min-height: 100vh;
}

img,
picture,
video,
canvas,
svg {
  display: block;
  max-width: 100%;
  height: auto;
}

input,
button,
textarea,
select {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  background: none;
  border: none;
}

ul,
ol {
  list-style: none;
}

table {
  border-collapse: collapse;
  border-spacing: 0;
}

h1, h2, h3, h4, h5, h6 {
  overflow-wrap: break-word;
  text-wrap: balance;
}

p {
  overflow-wrap: break-word;
  text-wrap: pretty;
}

a {
  color: var(--color-verity-blue);
  text-decoration: none;
  transition: color var(--transition-fast);

  &:hover {
    text-decoration: underline;
  }
}

/* -----------------------------------------------------------------------
   FOCUS STYLES
   ----------------------------------------------------------------------- */
:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 2px;
}

:focus:not(:focus-visible) {
  outline: none;
}

/* -----------------------------------------------------------------------
   APP SHELL
   ----------------------------------------------------------------------- */
#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

main {
  flex: 1;
}

/* -----------------------------------------------------------------------
   LAYOUT — Container
   ----------------------------------------------------------------------- */
.container {
  width: 100%;
  max-width: var(--grid-max-width);
  margin-inline: auto;
  padding-inline: var(--grid-margin);
}

/* -----------------------------------------------------------------------
   LAYOUT — Section
   ----------------------------------------------------------------------- */
.section {
  padding-block: var(--space-12);
}

/* -----------------------------------------------------------------------
   LAYOUT — Grid
   ----------------------------------------------------------------------- */
.grid {
  display: grid;
  gap: var(--grid-gutter);
}

.grid-2 {
  display: grid;
  gap: var(--grid-gutter);
  grid-template-columns: repeat(2, 1fr);
}

.grid-3 {
  display: grid;
  gap: var(--grid-gutter);
  grid-template-columns: repeat(3, 1fr);
}

.grid-4 {
  display: grid;
  gap: var(--grid-gutter);
  grid-template-columns: repeat(4, 1fr);
}

/* -----------------------------------------------------------------------
   TYPOGRAPHY UTILITIES — Display
   ----------------------------------------------------------------------- */
.display-xl {
  font-family: var(--display-xl-font-family);
  font-size: var(--display-xl-font-size);
  font-weight: var(--display-xl-font-weight);
  line-height: var(--display-xl-line-height);
}

.display-lg {
  font-family: var(--display-lg-font-family);
  font-size: var(--display-lg-font-size);
  font-weight: var(--display-lg-font-weight);
  line-height: var(--display-lg-line-height);
}

.display-md {
  font-family: var(--display-md-font-family);
  font-size: var(--display-md-font-size);
  font-weight: var(--display-md-font-weight);
  line-height: var(--display-md-line-height);
}

/* -----------------------------------------------------------------------
   TYPOGRAPHY UTILITIES — Headings
   ----------------------------------------------------------------------- */
.heading-lg {
  font-family: var(--heading-lg-font-family);
  font-size: var(--heading-lg-font-size);
  font-weight: var(--heading-lg-font-weight);
  line-height: var(--heading-lg-line-height);
}

.heading-md {
  font-family: var(--heading-md-font-family);
  font-size: var(--heading-md-font-size);
  font-weight: var(--heading-md-font-weight);
  line-height: var(--heading-md-line-height);
}

.heading-sm {
  font-family: var(--heading-sm-font-family);
  font-size: var(--heading-sm-font-size);
  font-weight: var(--heading-sm-font-weight);
  line-height: var(--heading-sm-line-height);
}

/* -----------------------------------------------------------------------
   TYPOGRAPHY UTILITIES — Body
   ----------------------------------------------------------------------- */
.body-lg {
  font-family: var(--body-lg-font-family);
  font-size: var(--body-lg-font-size);
  font-weight: var(--body-lg-font-weight);
  line-height: var(--body-lg-line-height);
}

.body-md {
  font-family: var(--body-md-font-family);
  font-size: var(--body-md-font-size);
  font-weight: var(--body-md-font-weight);
  line-height: var(--body-md-line-height);
}

.body-sm {
  font-family: var(--body-sm-font-family);
  font-size: var(--body-sm-font-size);
  font-weight: var(--body-sm-font-weight);
  line-height: var(--body-sm-line-height);
}

/* -----------------------------------------------------------------------
   TYPOGRAPHY UTILITIES — Data
   ----------------------------------------------------------------------- */
.data-xl {
  font-family: var(--data-xl-font-family);
  font-size: var(--data-xl-font-size);
  font-weight: var(--data-xl-font-weight);
  line-height: var(--data-xl-line-height);
}

.data-lg {
  font-family: var(--data-lg-font-family);
  font-size: var(--data-lg-font-size);
  font-weight: var(--data-lg-font-weight);
  line-height: var(--data-lg-line-height);
}

.data-md {
  font-family: var(--data-md-font-family);
  font-size: var(--data-md-font-size);
  font-weight: var(--data-md-font-weight);
  line-height: var(--data-md-line-height);
}

.data-sm {
  font-family: var(--data-sm-font-family);
  font-size: var(--data-sm-font-size);
  font-weight: var(--data-sm-font-weight);
  line-height: var(--data-sm-line-height);
}

/* -----------------------------------------------------------------------
   TYPOGRAPHY UTILITIES — Label
   ----------------------------------------------------------------------- */
.label-text {
  font-family: var(--label-font-family);
  font-size: var(--label-font-size);
  font-weight: var(--label-font-weight);
  line-height: var(--label-line-height);
  letter-spacing: var(--label-letter-spacing);
  text-transform: var(--label-text-transform);
}

/* -----------------------------------------------------------------------
   ACCESSIBILITY
   ----------------------------------------------------------------------- */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border-width: 0;
}

/* -----------------------------------------------------------------------
   PROSE — max-width for readable body text
   ----------------------------------------------------------------------- */
.prose {
  max-width: 65ch;
}

/* -----------------------------------------------------------------------
   REDUCED MOTION
   ----------------------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* -----------------------------------------------------------------------
   RESPONSIVE — Tablet (≤ 1024 px)
   ----------------------------------------------------------------------- */
@media (max-width: 1024px) {
  .container {
    padding-inline: var(--space-4);
  }

  .grid-3 {
    grid-template-columns: repeat(2, 1fr);
  }

  .grid-4 {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* -----------------------------------------------------------------------
   RESPONSIVE — Mobile (≤ 768 px)
   ----------------------------------------------------------------------- */
@media (max-width: 768px) {
  .container {
    padding-inline: var(--space-2);
  }

  .section {
    padding-block: var(--space-6);
  }

  .grid-2,
  .grid-3,
  .grid-4 {
    grid-template-columns: 1fr;
  }

  .display-xl {
    font-size: 36px;
    line-height: 42px;
  }

  .display-lg {
    font-size: 32px;
    line-height: 38px;
  }

  .display-md {
    font-size: 28px;
    line-height: 34px;
  }
}

@media (max-width: 768px) {
  .grid-2 {
    grid-template-columns: 1fr;
  }
  
  /* Prevent horizontal overflow */
  body {
    overflow-x: hidden;
  }
  
  /* Fix container on very small screens */
  .container {
    padding-inline: var(--space-2);
    width: 100%;
  }
}



/* --- css/components.css --- */
/* ==========================================================================
   VERITY COMPONENT STYLES — Premium Edition
   Rich micro-animations, glassmorphism, depth, interactivity.
   ========================================================================== */

/* -----------------------------------------------------------------------
   NAVBAR — Glassmorphism with smooth scroll reveal
   ----------------------------------------------------------------------- */
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 90;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border-bottom: 1px solid transparent;
  transition: border-color var(--transition-normal), box-shadow var(--transition-normal);
}

.navbar.scrolled {
  border-bottom-color: var(--color-stone);
  box-shadow: 0 1px 12px rgba(26, 24, 20, 0.04);
}

.navbar__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  max-width: var(--grid-max-width);
  margin-inline: auto;
  padding-inline: var(--grid-margin);
}

.navbar__logo {
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: opacity var(--transition-fast);
}

.navbar__logo:hover {
  text-decoration: none;
  opacity: 0.85;
}

.navbar__logo-img {
  height: 30px;
  width: auto;
}

.navbar__logo-text {
  font-family: var(--display-md-font-family);
  font-size: 22px;
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.02em;
}

.navbar__links {
  display: flex;
  align-items: center;
  gap: 4px;
}

.navbar__link {
  font-family: var(--body-sm-font-family);
  font-size: var(--body-sm-font-size);
  font-weight: 500;
  line-height: var(--body-sm-line-height);
  color: var(--color-graphite);
  text-decoration: none;
  padding: 8px 14px;
  border-radius: 8px;
  transition: color var(--transition-fast), background-color var(--transition-fast);
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  position: relative;
}

.navbar__link:hover {
  color: var(--color-ink);
  background-color: rgba(27, 79, 138, 0.05);
  text-decoration: none;
}

.navbar__link.active,
.navbar__link--active {
  color: var(--color-verity-blue);
  font-weight: 600;
  background-color: var(--color-accent-subtle);
}

/* Hamburger */
.navbar__hamburger {
  display: none;
  width: 44px;
  height: 44px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  cursor: pointer;
  border-radius: 8px;
  transition: background-color var(--transition-fast);
}

.navbar__hamburger:hover {
  background-color: var(--color-accent-subtle);
}

.navbar__hamburger-bar {
  display: block;
  width: 18px;
  height: 2px;
  background-color: var(--color-ink);
  border-radius: 2px;
  transition: transform var(--transition-normal), opacity var(--transition-normal);
}

/* Mobile overlay */
.navbar__overlay {
  position: fixed;
  inset: 0;
  background: rgba(255, 255, 255, 0.97);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  z-index: 100;
  overflow-y: auto;
  animation: overlayFadeIn 0.2s ease;
}

@keyframes overlayFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.navbar__overlay[hidden] {
  display: none;
}

.navbar__overlay-inner {
  padding: var(--space-4) var(--space-3);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  min-height: 100vh;
}

.navbar__overlay-close {
  align-self: flex-end;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  color: var(--color-graphite);
  border-radius: 8px;
  transition: background-color var(--transition-fast);
}

.navbar__overlay-close:hover {
  background-color: var(--color-accent-subtle);
}

.navbar__overlay-search {
  width: 100%;
}

.navbar__search-input {
  width: 100%;
  height: 52px;
  border: 1px solid var(--color-stone);
  border-radius: 12px;
  padding: 0 var(--space-2);
  font-size: var(--body-md-font-size);
  background-color: var(--color-chalk);
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}

.navbar__search-input:focus {
  border-color: var(--color-verity-blue);
  outline: none;
  box-shadow: 0 0 0 3px var(--color-accent-subtle);
}

.navbar__overlay-links {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.navbar__overlay-link {
  display: flex;
  align-items: center;
  min-height: 52px;
  padding: var(--space-1) var(--space-2);
  font-family: var(--heading-md-font-family);
  font-size: var(--heading-md-font-size);
  font-weight: 400;
  color: var(--color-graphite);
  text-decoration: none;
  border-radius: 10px;
  transition: color var(--transition-fast), background-color var(--transition-fast);
}

.navbar__overlay-link:hover,
.navbar__overlay-link.active {
  color: var(--color-verity-blue);
  background-color: var(--color-accent-subtle);
  text-decoration: none;
}

body {
  padding-top: 64px;
}

@media (max-width: 768px) {
  .navbar__inner {
    padding-inline: var(--space-2);
  }
  .navbar__links {
    display: flex;
    gap: 2px;
  }
  .navbar__hamburger {
    display: none;
  }
  .navbar__link {
    padding: 6px 8px;
    font-size: 13px;
    min-height: auto;
  }
  .navbar__logo-img {
    height: 30px !important;
  }
}

@media (max-width: 1024px) {
  .navbar__inner {
    padding-inline: var(--space-4);
  }
}

/* -----------------------------------------------------------------------
   FOOTER
   ----------------------------------------------------------------------- */
.footer {

  border-top: 1px solid var(--color-stone);
  padding-block: var(--space-8);

  line-height: var(--body-sm-line-height);
  color: var(--color-graphite);

  line-height: var(--label-line-height);
  letter-spacing: var(--label-letter-spacing);

  color: var(--color-ash);
  margin-bottom: var(--space-2);
}

.footer__links {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.footer__link {
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
  color: var(--color-graphite);
  text-decoration: none;
  transition: color var(--transition-fast);
}

.footer__link:hover {
  color: var(--color-verity-blue);
}

.footer__disclaimer {
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
  font-style: italic;
  color: var(--color-graphite);
}

.footer__copyright {
  font-size: var(--body-sm-font-size);
  color: var(--color-ash);
  margin-top: var(--space-2);
}

@media (max-width: 1024px) {
  .footer__inner { padding-inline: var(--space-4); }
}

@media (max-width: 768px) {
  .footer__inner {
    grid-template-columns: 1fr;
    gap: var(--space-4);
    padding-inline: var(--space-2);
  }
}

/* -----------------------------------------------------------------------
   GAP TYPE BADGE — with subtle pulse on first render
   ----------------------------------------------------------------------- */
.gap-badge {
  display: inline-flex;
  align-items: center;
  padding: 6px 14px;
  border-radius: 6px;
  font-weight: 600;
  font-size: 13px;
  line-height: 1;
  white-space: nowrap;
  transition: transform var(--transition-fast), box-shadow var(--transition-fast);
}

.gap-badge:hover {
  transform: translateY(-1px);
}

.gap-badge--1 { background-color: var(--color-gap-1-tint); color: var(--color-gap-1); }
.gap-badge--2 { background-color: var(--color-gap-2-tint); color: var(--color-gap-2); }
.gap-badge--3 { background-color: var(--color-gap-3-tint); color: var(--color-gap-3); }
.gap-badge--4 { background-color: var(--color-gap-4-tint); color: var(--color-gap-4); }

.gap-badge--small { padding: 4px 10px; font-size: 11px; }
.gap-badge--large { padding: 8px 18px; font-size: 15px; }

/* -----------------------------------------------------------------------
   METRIC TILE — with hover lift and animated value
   ----------------------------------------------------------------------- */
.metric-tile {
  background-color: var(--color-white);
  border: 1px solid var(--color-stone);
  border-radius: 12px;
  padding: var(--space-3);
  position: relative;
  transition: transform var(--transition-normal), box-shadow var(--transition-normal), border-color var(--transition-normal);
}

.metric-tile:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(26, 24, 20, 0.06);
  border-color: var(--color-dust);
}

.metric-tile--highlight {
  border-color: var(--color-verity-blue);
  background: linear-gradient(135deg, var(--color-accent-subtle) 0%, var(--color-white) 100%);
}

.metric-tile--highlight:hover {
  box-shadow: 0 8px 24px rgba(27, 79, 138, 0.12);
}

.metric-tile__value {
  font-family: var(--data-lg-font-family);
  font-size: var(--data-lg-font-size);
  font-weight: var(--data-lg-font-weight);
  line-height: var(--data-lg-line-height);
  color: var(--color-ink);
}

.metric-tile__label {
  font-family: var(--label-font-family);
  font-size: var(--label-font-size);
  font-weight: var(--label-font-weight);
  line-height: var(--label-line-height);
  letter-spacing: var(--label-letter-spacing);
  text-transform: var(--label-text-transform);
  color: var(--color-ash);
  margin-top: var(--space-1);
}

.metric-tile__sublabel {
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
  color: var(--color-ash);
  margin-top: 4px;
}

.metric-tile__tooltip-trigger {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 28px;
  height: 28px;
  min-width: 44px;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: var(--color-ash);
  border-radius: 50%;
  cursor: help;
  transition: background-color var(--transition-fast), color var(--transition-fast);
}

.metric-tile__tooltip-trigger:hover {
  background-color: var(--color-accent-subtle);
  color: var(--color-verity-blue);
}

/* -----------------------------------------------------------------------
   CONDITION CARD — premium lift and glow
   ----------------------------------------------------------------------- */
.condition-card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background-color: var(--color-white);
  border: 1px solid var(--color-stone);
  border-radius: 12px;
  padding: var(--space-4);
  text-decoration: none;
  color: inherit;
  transition: transform var(--transition-normal), box-shadow var(--transition-normal), border-color var(--transition-normal);
  min-height: 170px;
  position: relative;
  overflow: hidden;
}

/* Subtle gradient shimmer on hover */
.condition-card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent 60%, rgba(27, 79, 138, 0.03) 100%);
  opacity: 0;
  transition: opacity var(--transition-normal);
  pointer-events: none;
  border-radius: 12px;
}

.condition-card:hover {
  transform: translateY(-4px);
  border-color: var(--color-verity-blue);
  box-shadow: 0 12px 32px rgba(27, 79, 138, 0.1);
  text-decoration: none;
}

.condition-card:hover::after {
  opacity: 1;
}

.condition-card__header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: var(--space-2);
}

.condition-card__name {
  font-family: var(--heading-lg-font-family);
  font-size: var(--heading-lg-font-size);
  font-weight: var(--heading-lg-font-weight);
  line-height: var(--heading-lg-line-height);
  color: var(--color-ink);
}

.condition-card__badge { flex-shrink: 0; }

.condition-card__footer { margin-top: var(--space-3); }

.condition-card__score {
  display: flex;
  align-items: baseline;
  gap: 4px;
}

.condition-card__label {
  font-family: var(--label-font-family);
  font-size: var(--label-font-size);
  font-weight: var(--label-font-weight);
  line-height: var(--label-line-height);
  letter-spacing: var(--label-letter-spacing);
  text-transform: var(--label-text-transform);
  color: var(--color-ash);
  margin-top: 4px;
}

/* -----------------------------------------------------------------------
   EVIDENCE DOTS — with staggered entry animation
   ----------------------------------------------------------------------- */
.evidence-dots {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.evidence-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  transition: transform var(--transition-fast);
}

.evidence-dot--filled {
  animation: dotPop 0.3s ease backwards;
}

.evidence-dot--filled:nth-child(1) { animation-delay: 0ms; }
.evidence-dot--filled:nth-child(2) { animation-delay: 60ms; }
.evidence-dot--filled:nth-child(3) { animation-delay: 120ms; }
.evidence-dot--filled:nth-child(4) { animation-delay: 180ms; }
.evidence-dot--filled:nth-child(5) { animation-delay: 240ms; }

@keyframes dotPop {
  from { transform: scale(0); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.evidence-dot--empty {
  background-color: var(--color-dust);
}

.evidence-dots--small .evidence-dot {
  width: 8px;
  height: 8px;
}

.evidence-dots__label {
  margin-left: 8px;
  font-size: var(--body-sm-font-size);
  font-weight: 600;
  color: var(--color-graphite);
}

/* -----------------------------------------------------------------------
   SEARCH BAR — with focus glow
   ----------------------------------------------------------------------- */
.search-bar {
  width: 100%;
  max-width: 560px;
  position: relative;
}

.search-bar--large {
  max-width: 640px;
  margin-inline: auto;
}

.search-bar__input {
  width: 100%;
  height: 56px;
  border: 1px solid var(--color-stone);
  border-radius: 14px;
  padding: 0 var(--space-3);
  font-family: var(--body-lg-font-family);
  font-size: var(--body-lg-font-size);
  background-color: var(--color-white);
  transition: border-color var(--transition-fast), box-shadow var(--transition-normal);
}

.search-bar--large .search-bar__input {
  height: 64px;
  font-size: var(--body-lg-font-size);
  border-radius: 16px;
  box-shadow: 0 2px 12px rgba(26, 24, 20, 0.04);
}

.search-bar__input::placeholder { color: var(--color-dust); }

.search-bar__input:focus {
  border-color: var(--color-verity-blue);
  box-shadow: 0 0 0 4px rgba(27, 79, 138, 0.1), 0 4px 20px rgba(27, 79, 138, 0.06);
  outline: none;
}

.search-bar__dropdown {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background-color: var(--color-white);
  border: 1px solid var(--color-stone);
  border-radius: 14px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
  max-height: 320px;
  overflow-y: auto;
  z-index: 50;
  display: none;
  animation: dropdownSlide 0.15s ease;
}

@keyframes dropdownSlide {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

.search-bar__dropdown--visible { display: block; }

.search-bar__option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px var(--space-3);
  cursor: pointer;
  transition: background-color var(--transition-fast);
  min-height: 44px;
}

.search-bar__option:first-child { border-radius: 14px 14px 0 0; }
.search-bar__option:last-child { border-radius: 0 0 14px 14px; }

.search-bar__option:hover,
.search-bar__option--active {
  background-color: var(--color-accent-subtle);
}

.search-bar__option-name {
  font-weight: 500;
  color: var(--color-ink);
}

/* -----------------------------------------------------------------------
   FILTER CHIP — with smooth toggle animation
   ----------------------------------------------------------------------- */
.filter-group {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.filter-group__label {
  font-family: var(--label-font-family);
  font-size: var(--label-font-size);
  font-weight: var(--label-font-weight);
  line-height: var(--label-line-height);
  letter-spacing: var(--label-letter-spacing);
  text-transform: var(--label-text-transform);
  color: var(--color-ash);
}

.filter-group__chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1);
}

.filter-chip {
  display: inline-flex;
  align-items: center;
  padding: 8px 18px;
  border: 1px solid var(--color-stone);
  border-radius: 999px;
  font-family: var(--body-sm-font-family);
  font-size: var(--body-sm-font-size);
  font-weight: 500;
  line-height: var(--body-sm-line-height);
  color: var(--color-graphite);
  background-color: var(--color-white);
  cursor: pointer;
  transition: all var(--transition-fast);
  min-height: 44px;
}

.filter-chip:hover {
  border-color: var(--color-verity-blue);
  color: var(--color-verity-blue);
}

.filter-chip--active {
  background-color: var(--color-verity-blue);
  color: var(--color-white);
  border-color: var(--color-verity-blue);
  box-shadow: 0 2px 8px rgba(27, 79, 138, 0.2);
}

/* -----------------------------------------------------------------------
   ACCORDION — smooth open animation
   ----------------------------------------------------------------------- */
details.accordion {
  border: 1px solid var(--color-stone);
  border-radius: 12px;
  overflow: hidden;
  background-color: var(--color-white);
  transition: border-color var(--transition-normal);
}

details.accordion:hover {
  border-color: var(--color-dust);
}

summary.accordion__trigger {
  padding: var(--space-3) var(--space-4);
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--heading-md-font-family);
  font-size: var(--heading-md-font-size);
  font-weight: var(--heading-md-font-weight);
  line-height: var(--heading-md-line-height);
  color: var(--color-ink);
  list-style: none;
  min-height: 44px;
  user-select: none;
  transition: color var(--transition-fast);
}

summary.accordion__trigger:hover {
  color: var(--color-verity-blue);
}

summary.accordion__trigger::-webkit-details-marker { display: none; }
summary.accordion__trigger::marker { display: none; content: ''; }

.accordion__chevron {
  transition: transform var(--transition-normal);
  font-size: 16px;
  color: var(--color-ash);
}

details[open] .accordion__chevron {
  transform: rotate(180deg);
}

.accordion__content {
  padding: 0 var(--space-4) var(--space-4);
  animation: accordionOpen 0.2s ease;
}

@keyframes accordionOpen {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* -----------------------------------------------------------------------
   TOOLTIP
   ----------------------------------------------------------------------- */
.tooltip__content {
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  background-color: var(--color-ink);
  color: var(--color-white);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
  z-index: 40;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition-fast), transform var(--transition-fast);
  max-width: 260px;
  white-space: normal;
  transform: translateX(-50%) translateY(4px);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
}

.tooltip__content--visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* -----------------------------------------------------------------------
   BREADCRUMB
   ----------------------------------------------------------------------- */
.breadcrumb {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
  color: var(--color-ash);
  margin-bottom: var(--space-4);
}

.breadcrumb__link {
  color: var(--color-ash);
  text-decoration: none;
  transition: color var(--transition-fast);
}

.breadcrumb__link:hover { color: var(--color-verity-blue); }

.breadcrumb__separator {
  margin: 0 4px;
  color: var(--color-dust);
}

.breadcrumb__current {
  color: var(--color-graphite);
  font-weight: 600;
}

/* -----------------------------------------------------------------------
   CATEGORY TABS — with sliding indicator feel
   ----------------------------------------------------------------------- */
.category-tabs {
  display: flex;
  gap: 2px;
  border-bottom: 2px solid var(--color-stone);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.category-tabs::-webkit-scrollbar { display: none; }

.category-tab {
  padding: 12px var(--space-3);
  font-family: var(--body-sm-font-family);
  font-size: var(--body-sm-font-size);
  font-weight: 600;
  color: var(--color-ash);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  white-space: nowrap;
  transition: color var(--transition-fast), border-color var(--transition-normal);
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
}

.category-tab:hover { color: var(--color-graphite); }

.category-tab--active {
  color: var(--color-verity-blue);
  border-bottom-color: var(--color-verity-blue);
}

/* -----------------------------------------------------------------------
   FINDING CARD — with left accent on hover
   ----------------------------------------------------------------------- */
.finding-card {
  background-color: var(--color-warm-white);
  border: 1px solid var(--color-stone);
  border-radius: 10px;
  padding: var(--space-3) var(--space-4);
  border-left: 3px solid transparent;
  transition: border-left-color var(--transition-normal), box-shadow var(--transition-normal);
}

.finding-card:hover {
  border-left-color: var(--color-verity-blue);
  box-shadow: 0 2px 12px rgba(26, 24, 20, 0.04);
}

.finding-card + .finding-card { margin-top: var(--space-2); }

.finding-card__text {
  font-family: var(--body-lg-font-family);
  font-size: var(--body-lg-font-size);
  font-weight: var(--body-lg-font-weight);
  line-height: var(--body-lg-line-height);
  color: var(--color-ink);
  max-width: 65ch;
}

.finding-card__citation {
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
  color: var(--color-ash);
  margin-top: var(--space-2);
  display: flex;
  align-items: center;
  gap: var(--space-1);
}

.finding-card__citation a { color: var(--color-verity-blue); }

/* -----------------------------------------------------------------------
   CITATION LIST
   ----------------------------------------------------------------------- */
.citation-list .citation-item {
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
  color: var(--color-graphite);
  padding: var(--space-2) 0;
  border-bottom: 1px solid var(--color-stone);
}

.citation-list .citation-item:last-child { border-bottom: none; }

/* -----------------------------------------------------------------------
   DISCLAIMER BANNER
   ----------------------------------------------------------------------- */
.disclaimer-banner {
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
  font-style: italic;
  color: var(--color-graphite);
  padding: var(--space-3) var(--space-4);
  background-color: var(--color-warm-white);
  border-left: 3px solid var(--color-stone);
  border-radius: 0 10px 10px 0;
}

/* -----------------------------------------------------------------------
   STEP CARD — with animated number
   ----------------------------------------------------------------------- */
.step-card {
  text-align: center;
  padding: var(--space-4) var(--space-3);
  border-radius: 12px;
  transition: background-color var(--transition-normal);
}

.step-card:hover {
  background-color: var(--color-white);
}

.step-card__number {
  font-family: var(--data-lg-font-family);
  font-size: var(--data-lg-font-size);
  font-weight: var(--data-lg-font-weight);
  line-height: var(--data-lg-line-height);
  color: var(--color-verity-blue);
  margin-bottom: var(--space-2);
  opacity: 0.7;
}

.step-card__title {
  font-family: var(--heading-lg-font-family);
  font-size: var(--heading-lg-font-size);
  font-weight: var(--heading-lg-font-weight);
  line-height: var(--heading-lg-line-height);
  margin-bottom: var(--space-1);
}

.step-card__desc {
  font-family: var(--body-md-font-family);
  font-size: var(--body-md-font-size);
  line-height: var(--body-md-line-height);
  color: var(--color-graphite);
  max-width: 28ch;
  margin-inline: auto;
}

/* -----------------------------------------------------------------------
   STAT BLOCK — with counter animation support
   ----------------------------------------------------------------------- */
.stat-block {
  text-align: center;
  padding: var(--space-3);
}

.stat-block__number {
  font-family: var(--data-xl-font-family);
  font-size: var(--data-xl-font-size);
  font-weight: var(--data-xl-font-weight);
  line-height: var(--data-xl-line-height);
  color: var(--color-ink);
}

.stat-block__label {
  font-family: var(--body-md-font-family);
  font-size: var(--body-md-font-size);
  line-height: var(--body-md-line-height);
  color: var(--color-graphite);
  margin-top: var(--space-1);
  max-width: 22ch;
  margin-inline: auto;
}

/* -----------------------------------------------------------------------
   CONDITION CHIP — with hover scale
   ----------------------------------------------------------------------- */
.condition-chip {
  display: inline-flex;
  align-items: center;
  padding: 8px 18px;
  border: 1px solid var(--color-stone);
  border-radius: 999px;
  font-family: var(--body-sm-font-family);
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
  color: var(--color-graphite);
  text-decoration: none;
  cursor: pointer;
  transition: all var(--transition-fast);
  white-space: nowrap;
  background-color: var(--color-white);
}

.condition-chip:hover {
  border-color: var(--color-verity-blue);
  color: var(--color-verity-blue);
  text-decoration: none;
  transform: translateY(-1px);
  box-shadow: 0 2px 8px rgba(27, 79, 138, 0.08);
}

/* -----------------------------------------------------------------------
   DATA TABLE — with row hover animation
   ----------------------------------------------------------------------- */
.table-scroll-container {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border-radius: 12px;
  border: 1px solid var(--color-stone);
  background-color: var(--color-white);
}

.data-table {
  width: 100%;
  border-collapse: collapse;
}

.data-table th {
  font-family: var(--label-font-family);
  font-size: var(--label-font-size);
  font-weight: var(--label-font-weight);
  line-height: var(--label-line-height);
  letter-spacing: var(--label-letter-spacing);
  text-transform: var(--label-text-transform);
  text-align: left;
  padding: 14px var(--space-3);
  border-bottom: 2px solid var(--color-stone);
  color: var(--color-ash);
  user-select: none;
  white-space: nowrap;
}

.data-table th[data-sortable] {
  cursor: pointer;
  transition: color var(--transition-fast);
}

.data-table th[data-sortable]:hover { color: var(--color-verity-blue); }

.data-table td {
  padding: 14px var(--space-3);
  border-bottom: 1px solid var(--color-stone);
  font-size: var(--body-md-font-size);
  line-height: var(--body-md-line-height);
  vertical-align: middle;
}

.data-table tbody tr {
  transition: background-color var(--transition-fast);
}

.data-table tbody tr:nth-child(even) {
  background-color: rgba(0, 0, 0, 0.015);
}

.data-table tbody tr:hover {
  background-color: var(--color-accent-subtle);
}

.data-table__sort-icon {
  margin-left: 4px;
  opacity: 0.3;
  font-size: 12px;
}

.data-table__sort-icon--active {
  opacity: 1;
  color: var(--color-verity-blue);
}

.data-table__condition-link {
  color: var(--color-ink);
  font-weight: 600;
  text-decoration: none;
  transition: color var(--transition-fast);
}

.data-table__condition-link:hover {
  color: var(--color-verity-blue);
}

/* -----------------------------------------------------------------------
   GAP TYPE LEGEND
   ----------------------------------------------------------------------- */
.gap-legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  padding: var(--space-4) 0;
}

.gap-legend__item {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
  color: var(--color-graphite);
}

/* -----------------------------------------------------------------------
   FADE-IN ANIMATIONS — staggered entrance
   ----------------------------------------------------------------------- */
.fade-in-section {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

.fade-in-section.visible {
  opacity: 1;
  transform: translateY(0);
}

/* Stagger children within visible sections */
.fade-in-section.visible > .container > *:nth-child(1) { transition-delay: 0ms; }
.fade-in-section.visible > .container > *:nth-child(2) { transition-delay: 80ms; }
.fade-in-section.visible > .container > *:nth-child(3) { transition-delay: 160ms; }

@media (prefers-reduced-motion: reduce) {
  .fade-in-section {
    opacity: 1;
    transform: none;

  .evidence-dot--filled {
    animation: none;

    animation: none;

  .search-bar__dropdown {
    animation: none;

  .navbar__overlay {
    animation: none;

/* -----------------------------------------------------------------------

   ----------------------------------------------------------------------- */
.representation-panel {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-3);
  margin-bottom: var(--space-6);
}

.representation-panel__title {
  grid-column: 1 / -1;
  margin-bottom: var(--space-1);
}

/* Stagger metric tiles */
.representation-panel .metric-tile:nth-child(2) { animation: tileEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both; }
.representation-panel .metric-tile:nth-child(3) { animation: tileEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.representation-panel .metric-tile:nth-child(4) { animation: tileEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both; }
.representation-panel .metric-tile:nth-child(5) { animation: tileEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both; }
.representation-panel .metric-tile:nth-child(6) { animation: tileEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; }
.representation-panel .metric-tile:nth-child(7) { animation: tileEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; }

@keyframes tileEnter {
  from { opacity: 0; transform: translateY(12px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@media (max-width: 768px) {
  .representation-panel {

/* --- css/chatbot.css --- */
#verity-chatbot {
  position: fixed;
  bottom: var(--space-3);
  right: var(--space-3);
  z-index: 9999;
  font-family: var(--body-md-font-family);
}

/* -----------------------------------------------------------------------
   BUBBLE
   ----------------------------------------------------------------------- */
#verity-chatbot-bubble {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--color-verity-blue);
  color: var(--color-white);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 24px rgba(27, 79, 138, 0.28);
  transition: transform var(--transition-fast), box-shadow var(--transition-normal), background var(--transition-fast);
  animation: verity-bubble-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

@keyframes verity-bubble-in {
  from { opacity: 0; transform: scale(0.5) translateY(12px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

#verity-chatbot-bubble:hover {
  background: var(--color-accent-hover);
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(27, 79, 138, 0.32);
}

#verity-chatbot-bubble svg {
  width: 24px;
  height: 24px;
}

#verity-chatbot-window {
  display: flex;               /* always flex now — visibility controls showing */
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: scale(0.92) translateY(12px);
  transform-origin: bottom right;
  transition: opacity 0.22s ease,
              transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
              visibility 0s linear 0.22s;
  position: absolute;
  bottom: calc(56px + var(--space-2));
  right: 0;
  width: 360px;
  max-width: calc(100vw - 32px);
  height: 480px;
  max-height: calc(100vh - 140px);
  border: 1px solid var(--color-stone);
  border-radius: 16px;
  box-shadow: 0 12px 40px rgba(26, 24, 20, 0.14);
  flex-direction: column;
  overflow: hidden;
  background-color: var(--color-warm-white);
  background-image: radial-gradient(circle, var(--color-dust) 1px, transparent 1px);
  background-size: 16px 16px;
  background-position: -8px -8px;
}

#verity-chatbot-window.is-open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: scale(1) translateY(0);
  transition: opacity 0.22s ease,
              transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
              visibility 0s linear 0s;
}



/* -----------------------------------------------------------------------


/* -----------------------------------------------------------------------
   HEADER
   ----------------------------------------------------------------------- */
#verity-chatbot-header {
  padding: var(--space-2) var(--space-3);
  background: var(--color-verity-blue);
  color: var(--color-white);
  flex-shrink: 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-2);
}

#verity-chatbot-close {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-white);
  background: transparent;
  border: none;
  cursor: pointer;
  opacity: 0.85;
}

#verity-chatbot-close:hover {
  opacity: 1;
}

#verity-chatbot-close svg {
  width: 18px;
  height: 18px;
}

#verity-chatbot-title {
  font-family: var(--display-md-font-family);
  font-size: 20px;
  line-height: 24px;
  font-weight: 400;
}

#verity-chatbot-subtitle {
  font-size: 12px;
  line-height: 16px;
  color: rgba(255, 255, 255, 0.75);
  margin-top: 2px;
}

/* -----------------------------------------------------------------------
   DISCLAIMER
   ----------------------------------------------------------------------- */
#verity-chatbot-disclaimer {
  font-family: var(--label-font-family);
  font-size: 10.5px;
  line-height: 14px;
  letter-spacing: 0.03em;
  color: var(--color-graphite);
  background: var(--color-accent-subtle);
  border-bottom: 1px solid var(--color-stone);
  padding: var(--space-1) var(--space-3);
  flex-shrink: 0;
}

/* -----------------------------------------------------------------------
   MESSAGES
   ----------------------------------------------------------------------- */
#verity-chatbot-messages {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-2) var(--space-2);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.verity-msg {
  max-width: 84%;
  padding: 10px 13px;
  border-radius: 12px;
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
  word-wrap: break-word;
}

.verity-msg a {
  color: inherit;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.verity-msg--bot {
  align-self: flex-start;
  background: var(--color-white);
  border: 1px solid var(--color-stone);
  color: var(--color-ink);
  border-bottom-left-radius: 4px;
}

.verity-msg--user {
  align-self: flex-end;
  background: var(--color-verity-blue);
  color: var(--color-white);
  border-bottom-right-radius: 4px;
}

.verity-msg--typing {
  display: inline-flex;
  gap: 4px;
  align-items: center;
  padding: 12px 13px;
}

.verity-msg--typing span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--color-ash);
  animation: verity-typing-bounce 1.1s infinite ease-in-out;
}

.verity-msg--typing span:nth-child(2) { animation-delay: 0.15s; }
.verity-msg--typing span:nth-child(3) { animation-delay: 0.3s; }

@keyframes verity-typing-bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
  30% { transform: translateY(-3px); opacity: 1; }
}

/* -----------------------------------------------------------------------
   INPUT FORM
   ----------------------------------------------------------------------- */
#verity-chatbot-form {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  padding: var(--space-2);
  border-top: 1px solid var(--color-stone);
  background: var(--color-white);
  flex-shrink: 0;
}

#verity-chatbot-input {
  flex: 1;
  border: 1px solid var(--color-stone);
  border-radius: 10px;
  padding: 9px 12px;
  font-size: var(--body-sm-font-size);
  font-family: inherit;
  color: var(--color-ink);
  background: var(--color-chalk);
  outline: none;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}

#verity-chatbot-input:focus {
  border-color: var(--color-verity-blue);
  box-shadow: 0 0 0 3px var(--color-accent-subtle);
}

#verity-chatbot-input:disabled {
  opacity: 0.6;
}

#verity-chatbot-send {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--color-verity-blue);

/**
 * Find a condition by its URL slug.
 * @param {string} slug — e.g. 'adhd', 'heart-disease'
 * @returns {Object|undefined} The condition object, or undefined if not found.
 */
function getConditionBySlug(slug) {
  return conditions.find((c) => c.slug === slug);
}

/**
 * Get all conditions that match a given gap type.
 * @param {number} type — 1, 2, 3, or 4
 * @returns {Array<Object>} Array of condition objects.
 */
function getConditionsByGapType(type) {
  return conditions.filter((c) => c.gapType === type);
}

/**
 * Get all conditions sorted by representation score.
 * @param {boolean} ascending — if true (default), lowest scores first (worst gaps first)
 * @returns {Array<Object>} Sorted array of condition objects.
 */
function getConditionsSortedByScore(ascending = true) {
  return [...conditions].sort((a, b) =>
    ascending
      ? a.metrics.representationScore - b.metrics.representationScore
      : b.metrics.representationScore - a.metrics.representationScore
  );
}

/**
 * Get a deduplicated list of all condition categories.
 * @returns {Array<string>} Array of category names, sorted alphabetically.
 */
function getAllCategories() {
  const cats = new Set(conditions.map((c) => c.category));
  return [...cats].sort();
}


// Display the user's preferred short name while retaining the original record and URL.
function conditionDisplayName(condition) {
  return condition.slug === 'pcos' ? 'PMOS' : condition.name;
}

// js/components/gapTypeBadge.js
// Gap Type Badge component — displays a colored badge indicating the research gap classification.

/**
 * Mapping of gap type numbers to their labels and descriptions.
 * @type {Object.<number, {label: string, description: string}>}
 */
const GAP_TYPE_INFO = {
  1: {
    label: 'No Female Representation',
    description:
      'Studies on this condition have not included female participants in their research cohorts.',
  },
  2: {
    label: 'Women Included, Not Studied',
    description:
      'Female participants were included in study populations but sex-disaggregated analysis was not performed.',
  },
  3: {
    label: 'No Significant Differences Found',
    description:
      'Sex-disaggregated analysis was performed but no statistically significant differences were identified.',
  },
  4: {
    label: 'Insufficient Evidence',
    description:
      'There is not enough research data to draw meaningful conclusions about sex-based differences.',
  },
};

/**
 * Creates a gap type badge element.
 *
 * @param {number} gapType - The gap type number (1–4).
 * @param {Object} [options={}] - Display options.
 * @param {'small'|'normal'|'large'} [options.size='normal'] - Badge size variant.
 * @returns {HTMLSpanElement} The badge DOM element.
 */
function createGapTypeBadge(gapType, options = {}) {
  const { size = 'normal' } = options;
  const info = GAP_TYPE_INFO[gapType];

  if (!info) {
    const fallback = document.createElement('span');
    fallback.className = 'gap-badge';
    fallback.textContent = 'Unknown';
    return fallback;
  }

  const badge = document.createElement('span');
  badge.className = `gap-badge gap-badge--${gapType}`;

  if (size !== 'normal') {
    badge.classList.add(`gap-badge--${size}`);
  }

  badge.textContent = `Type ${gapType}: ${info.label}`;
  badge.setAttribute('aria-label', `Gap Type ${gapType}: ${info.label}`);

  return badge;
}


// --- js/components/evidenceQuality.js ---
// js/components/evidenceQuality.js
// Evidence Quality indicator — renders a row of dots representing evidence strength.

/**
 * Mapping of evidence quality scores to their text labels.
 * @type {Object.<number, string>}
 */
const EVIDENCE_LABELS = {
  1: 'Very Limited',
  2: 'Limited',
  3: 'Moderate',
  4: 'Moderate-Strong',
  5: 'Strong',
};

/** Maximum number of dots in the scale. */
const MAX_SCORE = 5;

/**
 * Creates an evidence quality indicator element.
 *
 * @param {number} score - Evidence quality score (1–5).
 * @param {Object} [options={}] - Display options.
 * @param {boolean} [options.showLabel=false] - Whether to show the text label.
 * @param {'small'|'normal'} [options.size='normal'] - Size variant.
 * @returns {HTMLDivElement} The evidence quality DOM element.
 */
function createEvidenceQuality(score, options = {}) {
  const { showLabel = false, size = 'normal' } = options;

  // Clamp score to valid range
  const clampedScore = Math.max(1, Math.min(MAX_SCORE, Math.round(score)));
  const label = EVIDENCE_LABELS[clampedScore] || 'Unknown';
  const cssVar = `var(--color-eq-${clampedScore})`;

  const container = document.createElement('div');
  container.className = 'evidence-dots';
  if (size === 'small') {
    container.classList.add('evidence-dots--small');
  }
  container.setAttribute(
    'aria-label',
    `Evidence quality: ${clampedScore} out of ${MAX_SCORE} — ${label}`
  );

  // Render dots
  for (let i = 1; i <= MAX_SCORE; i++) {
    const dot = document.createElement('span');
    if (i <= clampedScore) {
      dot.className = 'evidence-dot evidence-dot--filled';
      dot.style.backgroundColor = cssVar;
    } else {
      dot.className = 'evidence-dot evidence-dot--empty';
    }
    container.appendChild(dot);
  }

  // Optional text label
  if (showLabel) {
    const labelEl = document.createElement('span');
    labelEl.className = 'evidence-dots__label';
    labelEl.textContent = label;
    container.appendChild(labelEl);
  }

  return container;
}

// js/components/metricTile.js
// Metric Tile component — displays a key metric with optional tooltip.

/** Auto-incrementing ID counter for unique tooltip pair IDs. */
let tooltipIdCounter = 0;

/**
 * Creates a metric tile element.
 *
 * @param {Object} config - Tile configuration.
 * @param {string|number} config.value - The main metric value.
 * @param {string} config.label - Descriptive label below the value.
 * @param {string} [config.sublabel] - Optional secondary text.
 * @param {string} [config.tooltip] - Optional tooltip text.
 * @param {boolean} [config.highlight=false] - Whether to apply highlight styling.
 * @returns {HTMLDivElement} The metric tile DOM element.
 */
function createMetricTile({ value, label, sublabel, tooltip, highlight = false }) {
  const tile = document.createElement('div');
  tile.className = 'metric-tile';
  if (highlight) {
    tile.classList.add('metric-tile--highlight');
  }

  // Value
  const valueEl = document.createElement('div');
  valueEl.className = 'metric-tile__value data-lg';
  valueEl.textContent = String(value);
  tile.appendChild(valueEl);

  // Label
  const labelEl = document.createElement('div');
  labelEl.className = 'metric-tile__label label-text';
  labelEl.textContent = label;
  tile.appendChild(labelEl);

  // Sublabel (optional)
  if (sublabel) {
    const sublabelEl = document.createElement('div');
    sublabelEl.className = 'metric-tile__sublabel body-sm';
    sublabelEl.style.color = 'var(--color-ash)';
    sublabelEl.textContent = sublabel;
    tile.appendChild(sublabelEl);
  }

  // Tooltip (optional)
  if (tooltip) {
    const tooltipId = `metric-tooltip-${++tooltipIdCounter}`;

    const trigger = document.createElement('button');
    trigger.className = 'metric-tile__tooltip-trigger';
    trigger.type = 'button';
    trigger.setAttribute('aria-describedby', tooltipId);
    trigger.setAttribute('aria-label', 'More information');
    trigger.textContent = '\u2139'; // ℹ info symbol

    const content = document.createElement('div');
    content.className = 'tooltip__content';
    content.id = tooltipId;
    content.setAttribute('role', 'tooltip');
    content.textContent = tooltip;

    // Show/hide on hover and focus
    const show = () => content.classList.add('tooltip__content--visible');
    const hide = () => content.classList.remove('tooltip__content--visible');

    trigger.addEventListener('mouseenter', show);
    trigger.addEventListener('mouseleave', hide);
    trigger.addEventListener('focus', show);
    trigger.addEventListener('blur', hide);

    tile.appendChild(trigger);
    tile.appendChild(content);
  }

  return tile;
}

// --- js/components/searchBar.js ---
// js/components/searchBar.js
// Search Bar component — accessible combobox with condition filtering and keyboard navigation.




/** Auto-incrementing ID counter for unique combobox instance IDs. */
let searchBarIdCounter = 0;

/**
 * Creates a search bar element with autocomplete dropdown.
 *
 * @param {Object} [options={}] - Configuration options.
 * @param {string} [options.placeholder='Search a condition...'] - Input placeholder.
 * @param {function(Object): void} [options.onSelect] - Callback when a condition is selected.
 * @param {boolean} [options.autofocus=false] - Whether the input should be autofocused.
 * @param {'large'|'normal'} [options.size='normal'] - Size variant.
 * @returns {HTMLDivElement} The search bar DOM element.
 */
function createSearchBar(options = {}) {
  const {
    placeholder = 'Search a condition...',
    onSelect,
    autofocus = false,
    size = 'normal',
  } = options;

  const instanceId = ++searchBarIdCounter;
  const listboxId = `search-listbox-${instanceId}`;

  // State
  let filteredConditions = [];
  let activeIndex = -1;
  let isOpen = false;

  // --- Container ---
  const container = document.createElement('div');
  container.className = 'search-bar';
  if (size === 'large') {
    container.classList.add('search-bar--large');
  }

  // --- Input ---
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'search-bar__input';
  input.placeholder = placeholder;
  input.setAttribute('role', 'combobox');
  input.setAttribute('aria-expanded', 'false');
  input.setAttribute('aria-controls', listboxId);
  input.setAttribute('aria-autocomplete', 'list');
  input.setAttribute('aria-activedescendant', '');
  if (autofocus) {
    input.autofocus = true;
  }
  container.appendChild(input);

  // --- Dropdown ---
  const dropdown = document.createElement('div');
  dropdown.className = 'search-bar__dropdown';
  dropdown.id = listboxId;
  dropdown.setAttribute('role', 'listbox');
  container.appendChild(dropdown);

  // --- Helpers ---

  /** Generate a unique option ID for a given index. */
  function optionId(index) {
    return `search-option-${instanceId}-${index}`;
  }

  /** Open the dropdown and render filtered results. */
  function openDropdown() {
    if (filteredConditions.length === 0) {
      closeDropdown();
      return;
    }
    isOpen = true;
    dropdown.classList.add('search-bar__dropdown--visible');
    input.setAttribute('aria-expanded', 'true');
    renderOptions();
  }

  /** Close the dropdown and reset active index. */
  function closeDropdown() {
    isOpen = false;
    activeIndex = -1;
    dropdown.classList.remove('search-bar__dropdown--visible');
    input.setAttribute('aria-expanded', 'false');
    input.setAttribute('aria-activedescendant', '');
    // Clear dropdown children
    while (dropdown.firstChild) {
      dropdown.removeChild(dropdown.firstChild);
    }
  }

  /** Render the filtered condition options into the dropdown. */
  function renderOptions() {
    // Clear existing options
    while (dropdown.firstChild) {
      dropdown.removeChild(dropdown.firstChild);
    }

    filteredConditions.forEach((condition, index) => {
      const option = document.createElement('div');
      option.className = 'search-bar__option';
      option.id = optionId(index);
      option.setAttribute('role', 'option');
      option.setAttribute('aria-selected', String(index === activeIndex));

      if (index === activeIndex) {
        option.classList.add('search-bar__option--active');
      }

      // Condition name
      const nameSpan = document.createElement('span');
      nameSpan.className = 'search-bar__option-name';
      nameSpan.textContent = conditionDisplayName(condition);
      option.appendChild(nameSpan);

      // Gap type badge
      option.appendChild(createGapTypeBadge(condition.gapType, { size: 'small' }));

      // Click handler
      option.addEventListener('mousedown', (e) => {
        // Prevent input blur before selection
        e.preventDefault();
        selectCondition(condition);
      });

      dropdown.appendChild(option);
    });
  }

  /** Update the visual active state of options. */
  function updateActiveOption() {
    const optionEls = dropdown.querySelectorAll('.search-bar__option');
    optionEls.forEach((el, index) => {
      const isActive = index === activeIndex;
      el.classList.toggle('search-bar__option--active', isActive);
      el.setAttribute('aria-selected', String(isActive));
    });

    if (activeIndex >= 0) {
      const activeId = optionId(activeIndex);
      input.setAttribute('aria-activedescendant', activeId);

      // Scroll active option into view
      const activeEl = document.getElementById(activeId);
      if (activeEl) {
        activeEl.scrollIntoView({ block: 'nearest' });
      }
    } else {
      input.setAttribute('aria-activedescendant', '');
    }
  }

  /** Handle condition selection. */
  function selectCondition(condition) {
    input.value = conditionDisplayName(condition);
    closeDropdown();

    if (typeof onSelect === 'function') {
      onSelect(condition);
    } else {
      // Default navigation
      window.location.hash = '#/conditions/' + condition.slug;
    }
  }

  // --- Event Listeners ---

  // Filter on input
  input.addEventListener('input', () => {
    const query = input.value.trim().toLowerCase();
    if (query.length === 0) {
      filteredConditions = [];
      closeDropdown();
      return;
    }

    filteredConditions = conditions.filter((c) =>
      c.name.toLowerCase().includes(query)
    );
    activeIndex = -1;
    openDropdown();
  });

  // Keyboard navigation
  input.addEventListener('keydown', (e) => {
    if (!isOpen) {
      // If dropdown is closed and user presses down, trigger filtering
      if (e.key === 'ArrowDown' && input.value.trim().length > 0) {
        openDropdown();
        e.preventDefault();
      }
      return;
    }

    switch (e.key) {
      case 'ArrowDown':
        e.preventDefault();
        activeIndex = Math.min(activeIndex + 1, filteredConditions.length - 1);
        updateActiveOption();
        break;

      case 'ArrowUp':
        e.preventDefault();
        activeIndex = Math.max(activeIndex - 1, 0);
        updateActiveOption();
        break;

      case 'Enter':
        e.preventDefault();
        if (activeIndex >= 0 && activeIndex < filteredConditions.length) {
          selectCondition(filteredConditions[activeIndex]);
        }
        break;

      case 'Escape':
        e.preventDefault();
        closeDropdown();
        break;
    }
  });

  // Close on blur (when focus leaves the container)
  input.addEventListener('blur', () => {
    // Small delay to allow mousedown on option to fire first
    setTimeout(() => {
      closeDropdown();
    }, 150);
  });

  // Close on outside click
  document.addEventListener('click', (e) => {
    if (!container.contains(e.target)) {
      closeDropdown();
    }
  });

  return container;
}

let verityDotsCleanup = null;

function initVerityDotsBackground() {
  if (verityDotsCleanup) verityDotsCleanup();
  const canvas = document.getElementById('verity-dots-bg');
  const spotlight = document.getElementById('verity-dots-spotlight');
  if (!canvas || !spotlight) return;
  const hero = canvas.parentElement;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  let frame = 0, x = 0, y = 0, targetX = 0, targetY = 0, active = false;
  const motionAllowed = !window.matchMedia('(prefers-reduced-motion: reduce)').matches && window.matchMedia('(pointer: fine)').matches;
  function resize() {
    const rect = hero.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px'; canvas.style.height = rect.height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, rect.width, rect.height);
    ctx.fillStyle = 'rgba(74,69,64,0.20)';
    for (let y = 20; y < rect.height; y += 42) for (let x = 20; x < rect.width; x += 42) {
      ctx.beginPath(); ctx.arc(x, y, 0.85, 0, Math.PI * 2); ctx.fill();
    }
  }
  function tick() {
    x += (targetX - x) * 0.12; y += (targetY - y) * 0.12;
    spotlight.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    if (active && (Math.abs(targetX-x) > .2 || Math.abs(targetY-y) > .2)) frame = requestAnimationFrame(tick);
    else frame = 0;
  }
  function move(event) {
    const rect = hero.getBoundingClientRect(); targetX = event.clientX - rect.left; targetY = event.clientY - rect.top;
    if (!active) { x = targetX; y = targetY; }
    active = true; spotlight.style.opacity = '1';
    if (!frame) frame = requestAnimationFrame(tick);
  }
  function leave() { active = false; spotlight.style.opacity = '0'; }
  resize(); window.addEventListener('resize', resize);
  if (motionAllowed) { hero.addEventListener('pointermove', move, { passive: true }); hero.addEventListener('pointerleave', leave); }
  verityDotsCleanup = () => {
    window.removeEventListener('resize', resize); hero.removeEventListener('pointermove', move); hero.removeEventListener('pointerleave', leave);
    if (frame) cancelAnimationFrame(frame); verityDotsCleanup = null;
  };
}

// js/components/filterChip.js
// Filter Chip Group component — a radio-like group of toggle buttons for filtering.

/**
 * Creates a filter chip group element.
 *
 * @param {Object} config - Group configuration.
 * @param {string} config.label - Group label text.
 * @param {Array<{value: string, text: string}>} config.options - Chip options.
 * @param {string} config.activeValue - Currently active value.
 * @param {function(string): void} config.onChange - Callback when selection changes.
 * @returns {HTMLDivElement} The filter chip group DOM element.
 */
function createFilterChipGroup({ label, options, activeValue, onChange }) {
  const group = document.createElement('div');
  group.className = 'filter-group';

  // Label
  const labelEl = document.createElement('span');
  labelEl.className = 'filter-group__label label-text';
  labelEl.textContent = label;
  group.appendChild(labelEl);

  // Chips container
  const chipsContainer = document.createElement('div');
  chipsContainer.className = 'filter-group__chips';
  chipsContainer.setAttribute('role', 'group');
  chipsContainer.setAttribute('aria-label', label);

  /** @type {Map<string, HTMLButtonElement>} */
  const chipMap = new Map();

  options.forEach((option) => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'filter-chip';
    chip.textContent = option.text;

    const isActive = option.value === activeValue;
    if (isActive) {
      chip.classList.add('filter-chip--active');
    }
    chip.setAttribute('aria-pressed', String(isActive));

    chip.addEventListener('click', () => {
      // If already active, do nothing
      if (chip.classList.contains('filter-chip--active')) {
        return;
      }

      // Deactivate all chips
      chipMap.forEach((c) => {
        c.classList.remove('filter-chip--active');
        c.setAttribute('aria-pressed', 'false');
      });

      // Activate clicked chip
      chip.classList.add('filter-chip--active');
      chip.setAttribute('aria-pressed', 'true');

      if (typeof onChange === 'function') {
        onChange(option.value);
      }
    });

    chipMap.set(option.value, chip);
    chipsContainer.appendChild(chip);
  });

  group.appendChild(chipsContainer);

  return group;
}

  logoImg.alt = 'Verity';
  logoImg.className = 'navbar__logo-img';
  logoImg.style.height = '38px';
  logoImg.style.width = 'auto';
  logoLink.appendChild(logoImg);

  // ── Desktop nav links ──
  const navList = document.createElement('ul');
  navList.className = 'navbar__links';
  navList.setAttribute('role', 'list');

  NAV_LINKS.forEach((link) => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = link.href;
    a.className = 'navbar__link';
    a.textContent = link.label;
    a.dataset.matchPattern = link.matchPattern.source;
    li.appendChild(a);
    navList.appendChild(li);
  });

  // ── Mobile hamburger button ──
  const hamburger = document.createElement('button');
  hamburger.className = 'navbar__hamburger';
  hamburger.setAttribute('aria-label', 'Open navigation menu');
  hamburger.setAttribute('aria-expanded', 'false');
  hamburger.setAttribute('aria-controls', 'mobile-menu-overlay');
  hamburger.type = 'button';

  // Three-bar icon
  for (let i = 0; i < 3; i++) {
    const bar = document.createElement('span');
    bar.className = 'navbar__hamburger-bar';
    bar.setAttribute('aria-hidden', 'true');
    hamburger.appendChild(bar);
  }

  inner.appendChild(logoLink);
  inner.appendChild(navList);
  inner.appendChild(hamburger);
  container.appendChild(inner);

  // ── Mobile overlay ──
  const overlay = document.createElement('div');
  overlay.id = 'mobile-menu-overlay';
  overlay.className = 'navbar__overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-label', 'Mobile navigation menu');
  overlay.hidden = true;

  const overlayInner = document.createElement('div');
  overlayInner.className = 'navbar__overlay-inner';

  // Close button
  const closeBtn = document.createElement('button');
  closeBtn.className = 'navbar__overlay-close';
  closeBtn.setAttribute('aria-label', 'Close navigation menu');
  closeBtn.type = 'button';
  closeBtn.textContent = '×';

  // Mobile nav links
  const mobileNavList = document.createElement('ul');
  mobileNavList.className = 'navbar__overlay-links';
  mobileNavList.setAttribute('role', 'list');

  // Add Home link in mobile menu
  const homeLi = document.createElement('li');
  const homeA = document.createElement('a');
  homeA.href = '#/';
  homeA.className = 'navbar__overlay-link';
  homeA.textContent = 'Home';
  homeLi.appendChild(homeA);
  mobileNavList.appendChild(homeLi);

  NAV_LINKS.forEach((link) => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = link.href;
    a.className = 'navbar__overlay-link';
    a.textContent = link.label;
    li.appendChild(a);
    mobileNavList.appendChild(li);
  });

  overlayInner.appendChild(closeBtn);
  overlayInner.appendChild(mobileNavList);
  overlay.appendChild(overlayInner);
  container.appendChild(overlay);

  // ── Event handlers ──

  // Toggle overlay
  hamburger.addEventListener('click', () => {
    const isOpen = !overlay.hidden;
    if (isOpen) {
      closeOverlay();
    } else {
      openOverlay();
    }
  });

  closeBtn.addEventListener('click', closeOverlay);

  // Close on overlay background click
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) {
      closeOverlay();
    }
  });

  // Close on Escape
  overlay.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeOverlay();
    }
  });

  // Close overlay and navigate when mobile links are clicked
  mobileNavList.addEventListener('click', (e) => {
    const link = e.target.closest('a');
    if (link) {
      closeOverlay();
    }
  });

  function openOverlay() {
    overlay.hidden = false;
    hamburger.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';
    closeBtn.focus();
  }

  function closeOverlay() {
    overlay.hidden = true;
    hamburger.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
    hamburger.focus();
  }

  // ── Active link tracking ──
  function updateActiveLinks() {
    const hash = window.location.hash || '#/';

    // Desktop links
    navList.querySelectorAll('.navbar__link').forEach((a) => {
      const pattern = new RegExp(a.dataset.matchPattern);
      if (pattern.test(hash)) {
        a.classList.add('active');
        a.setAttribute('aria-current', 'page');
      } else {
        a.classList.remove('active');
        a.removeAttribute('aria-current');
      }
    });

    // Mobile links
    mobileNavList.querySelectorAll('.navbar__overlay-link').forEach((a) => {
      const linkHash = a.getAttribute('href');
      if (hash === linkHash || (linkHash !== '#/' && hash.startsWith(linkHash.replace('#', '#')))) {
        a.classList.add('active');
      } else {
        a.classList.remove('active');
      }
    });
  }

  updateActiveLinks();
  window.addEventListener('hashchange', updateActiveLinks);
}

/**
 * Home page renderer for the Verity SPA — Premium Edition.
 * Animated counters, interactive charts, rich micro-interactions.
 */







/**
 * Render the home page into the given container.
 * @param {HTMLElement} container
 */
function renderHomePage(container) {
  container.textContent = '';

  // ── Hero Section ──
  const hero = document.createElement('section');
  hero.className = 'hero section';

  const dotsCanvas = document.createElement('canvas');
dotsCanvas.id = 'verity-dots-bg';
dotsCanvas.setAttribute('aria-hidden', 'true');
hero.appendChild(dotsCanvas);

  const dotsSpotlight = document.createElement('div');
  dotsSpotlight.id = 'verity-dots-spotlight';
  dotsSpotlight.setAttribute('aria-hidden', 'true');
  hero.appendChild(dotsSpotlight);

  const heroArt = document.createElement('div');
  heroArt.className = 'hero__art';
  heroArt.setAttribute('aria-hidden', 'true');
  ['large', 'medium', 'small'].forEach(size => {
    const orb = document.createElement('span');
    orb.className = `hero__orb hero__orb--${size}`;
    heroArt.appendChild(orb);
  });
  hero.appendChild(heroArt);

/**
 * Animate stat block counters when they scroll into view.
 */
function initCounterAnimations() {
  const counters = document.querySelectorAll('.stat-block__number[data-target]');
  if (counters.length === 0) return;

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const el = entry.target;
        const target = parseInt(el.dataset.target);
        const prefix = el.dataset.prefix || '';
        const suffix = el.dataset.suffix || '';

        if (prefersReducedMotion) {
          el.textContent = `${prefix}${target}${suffix}`;
        } else {
          animateCounter(el, target, prefix, suffix);
        }
        observer.unobserve(el);
      }
    });
  }, { threshold: 0.01 });

  counters.forEach(c => observer.observe(c));
}

/**
 * Animate a number from 0 to target.
 */
function animateCounter(el, target, prefix, suffix) {
  const duration = 1200;
  const start = performance.now();

  function update(now) {
    const elapsed = now - start;
    const progress = Math.min(elapsed / duration, 1);
    // Ease-out cubic
    const eased = 1 - Math.pow(1 - progress, 3);
    const current = Math.round(eased * target);
    el.textContent = `${prefix}${current}${suffix}`;

    if (progress < 1) {
      requestAnimationFrame(update);
    }
  }

  requestAnimationFrame(update);
}

/**
 * Animate score bar fills when they scroll into view.
 */
function initBarAnimations() {
  const bars = document.querySelectorAll('.score-bar-fill');
  if (bars.length === 0) return;

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const bar = entry.target;
        const targetWidth = bar.dataset.width;
        if (prefersReducedMotion) {
          bar.style.width = targetWidth;
        } else {
          // Stagger bars slightly
          const index = Array.from(bars).indexOf(bar);
          setTimeout(() => {
            bar.style.width = targetWidth;
          }, index * 80);
        }
        observer.unobserve(bar);
      }
    });
  }, { threshold: 0.01 });

  bars.forEach(b => observer.observe(b));
}

/**
 * Creates a ranked list item with name, score, and evidence dots.
 */
function createRankedItem(condition) {
  const item = document.createElement('a');
  item.href = `#/conditions/${condition.slug}`;
  item.className = 'gap-preview__item';

  const left = document.createElement('div');
  left.style.cssText = 'display:flex; align-items:center; gap:var(--space-2);';

  const name = document.createElement('span');
  name.className = 'body-md';
  name.style.fontWeight = '600';
  name.textContent = conditionDisplayName(condition);

  const dots = createEvidenceQuality(condition.metrics.evidenceQuality, { size: 'small' });

  left.appendChild(name);
  left.appendChild(dots);

  const score = document.createElement('span');
  score.className = 'data-md';
  score.textContent = condition.metrics.representationScore;

  item.appendChild(left);
  item.appendChild(score);

  return item;
}

    const text = document.createElement('span');
    text.textContent = `${source.authors} (${source.year}). ${source.title}. `;

    const journal = document.createElement('em');
    journal.textContent = source.journal;

    const link = document.createElement('a');
    link.href = source.doi ? `https://doi.org/${source.doi}` : `https://pubmed.ncbi.nlm.nih.gov/${source.pmid}`;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = source.pmid ? ` PMID ${source.pmid}` : ` DOI ${source.doi}`;

    item.appendChild(text);
    item.appendChild(journal);
    item.appendChild(link);
    srcContent.appendChild(item);
  });

  srcDetails.appendChild(srcSummary);
  srcDetails.appendChild(srcContent);
  wrapper.appendChild(srcDetails);

  // ── 9. Related Conditions ──
  if (condition.relatedConditions && condition.relatedConditions.length > 0) {
    const related = document.createElement('section');
    related.className = 'related-conditions';

    const relTitle = document.createElement('h2');
    relTitle.className = 'heading-lg';
    relTitle.textContent = 'Related Conditions';

    const relChips = document.createElement('div');
    relChips.className = 'related-conditions__chips';

    condition.relatedConditions.forEach(slug => {
      const relCond = getConditionBySlug(slug);
      if (relCond) {
        const chip = document.createElement('a');
        chip.href = `#/conditions/${relCond.slug}`;
        chip.className = 'condition-chip';
        chip.textContent = `${conditionDisplayName(relCond)} →`;
        relChips.appendChild(chip);
      }
    });

    related.appendChild(relTitle);
    related.appendChild(relChips);
    wrapper.appendChild(related);
  }

  page.appendChild(wrapper);
  container.appendChild(page);
}

/**
