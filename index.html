/**
 * Render the Gap Index page.
 * @param {HTMLElement} container
 */
function renderGapIndexPage(container) {
  container.textContent = '';

  const page = document.createElement('div');
  page.className = 'gap-index-page';

  const wrapper = document.createElement('div');
  wrapper.className = 'container';

  // ── 1. Header ──
  const headerSection = document.createElement('header');
  headerSection.className = 'section';
  headerSection.style.paddingBottom = '0';

  const h1 = document.createElement('h1');
  h1.className = 'display-lg';
  h1.textContent = 'Research Gap Index';

  const subtitle = document.createElement('p');
  subtitle.className = 'body-lg';
  subtitle.style.color = 'var(--color-graphite)';
  subtitle.style.maxWidth = '720px';
  subtitle.textContent = 'A ranked overview of female research coverage across 10 indexed conditions. Sortable by representation score, gap type, and evidence quality.';

  headerSection.appendChild(h1);
  headerSection.appendChild(subtitle);
  wrapper.appendChild(headerSection);

  // ── 2. Methodology Accordion ──
  const methDetails = document.createElement('details');
  methDetails.className = 'accordion';
  methDetails.style.marginTop = 'var(--space-4)';

  const methSummary = document.createElement('summary');
  methSummary.className = 'accordion__trigger';
  methSummary.textContent = 'Methodology';
  const methChevron = document.createElement('span');
  methChevron.className = 'accordion__chevron';
  methChevron.setAttribute('aria-hidden', 'true');
  methChevron.textContent = '▾';
  methSummary.appendChild(methChevron);

  const methContent = document.createElement('div');
  methContent.className = 'accordion__content';
  const methP = document.createElement('p');
  methP.className = 'body-md';
  methP.textContent = 'The Research Gap Index evaluates conditions based on a composite representation score derived from four metrics: the proportion of studies including female participants, the proportion of female-only studies, the proportion of studies conducting sex-disaggregated analysis, and an overall evidence quality assessment. Conditions are classified into one of four gap types based on the nature of the representation gap identified. Data is sourced from PubMed, PubMed Central, and Europe PMC.';
  methContent.appendChild(methP);

  methDetails.appendChild(methSummary);
  methDetails.appendChild(methContent);
  wrapper.appendChild(methDetails);

  // ── State ──
  let gapFilter = 'all';
  let eqFilter = 'all';
  let sortCol = 'score';
  let sortAsc = false;

  // ── 3. Filter Bar ──
  const filterBar = document.createElement('div');
  filterBar.className = 'gap-index__filters';

  const gapChips = createFilterChipGroup({
    label: 'Gap Type',
    options: [
      { value: 'all', text: 'All' },
      { value: '1', text: 'Type 1' },
      { value: '2', text: 'Type 2' },
      { value: '3', text: 'Type 3' },
      { value: '4', text: 'Type 4' },
    ],
    activeValue: 'all',
    onChange: (val) => {
      gapFilter = val;
      renderTable();
    },
  });

  const eqChips = createFilterChipGroup({
    label: 'Evidence Quality',
    options: [
      { value: 'all', text: 'All' },
      { value: 'high', text: 'High (4-5)' },
      { value: 'moderate', text: 'Moderate (3)' },
      { value: 'limited', text: 'Limited (1-2)' },
    ],
    activeValue: 'all',
    onChange: (val) => {
      eqFilter = val;
      renderTable();
    },
  });

  filterBar.appendChild(gapChips);
  filterBar.appendChild(eqChips);
  wrapper.appendChild(filterBar);

  // ── 4. Table Container ──
  const tableContainer = document.createElement('div');
  tableContainer.className = 'gap-index__table-container';
  wrapper.appendChild(tableContainer);

  /** Get filtered and sorted conditions. */
  function getFilteredConditions() {
    let data = [...conditions];

    // Gap type filter
    if (gapFilter !== 'all') {
      data = data.filter(c => c.gapType === parseInt(gapFilter));
    }

    // Evidence quality filter
    if (eqFilter !== 'all') {
      if (eqFilter === 'high') {
        data = data.filter(c => c.metrics.evidenceQuality >= 4);
      } else if (eqFilter === 'moderate') {
        data = data.filter(c => c.metrics.evidenceQuality === 3);
      } else if (eqFilter === 'limited') {
        data = data.filter(c => c.metrics.evidenceQuality <= 2);
      }
    }

    // Sort
    data.sort((a, b) => {
      let valA, valB;
      switch (sortCol) {
        case 'name':
          valA = a.name.toLowerCase();
          valB = b.name.toLowerCase();
          return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
        case 'gapType':
          valA = a.gapType;
          valB = b.gapType;
          break;
        case 'women':
          valA = a.metrics.studiesIncludingWomen.percent;
          valB = b.metrics.studiesIncludingWomen.percent;
          break;
        case 'disagg':
          valA = a.metrics.sexDisaggregated.percent;
          valB = b.metrics.sexDisaggregated.percent;
          break;
        case 'eq':
          valA = a.metrics.evidenceQuality;
          valB = b.metrics.evidenceQuality;
          break;
        case 'score':
        default:
          valA = a.metrics.representationScore;
          valB = b.metrics.representationScore;
          break;
      }
      if (typeof valA === 'string') return 0;
      return sortAsc ? valA - valB : valB - valA;
    });

    return data;
  }

  /** Render or re-render the data table. */
  function renderTable() {
    tableContainer.textContent = '';

    const data = getFilteredConditions();

    const scrollContainer = document.createElement('div');
    scrollContainer.className = 'table-scroll-container';

    const table = document.createElement('table');
    table.className = 'data-table';

    // Header
    const thead = document.createElement('thead');
    const headerRow = document.createElement('tr');

    const columns = [
      { key: 'name', label: 'Condition' },
      { key: 'gapType', label: 'Gap Type' },
      { key: 'women', label: '% Women' },
      { key: 'disagg', label: '% Sex-Disagg.' },
      { key: 'eq', label: 'Evidence' },
      { key: 'score', label: 'Score' },
    ];

    columns.forEach(col => {
      const th = document.createElement('th');
      th.setAttribute('data-sortable', '');
      th.setAttribute('scope', 'col');

      const sortButton = document.createElement('button');
      sortButton.type = 'button';
      sortButton.dataset.sortCol = col.key;
      sortButton.appendChild(document.createTextNode(col.label + ' '));
      th.setAttribute('aria-sort', sortCol === col.key ? (sortAsc ? 'ascending' : 'descending') : 'none');
      th.appendChild(sortButton);

      const arrow = document.createElement('span');
      arrow.className = 'data-table__sort-icon';
      if (sortCol === col.key) {
        arrow.classList.add('data-table__sort-icon--active');
        arrow.textContent = sortAsc ? '↑' : '↓';
      } else {
        arrow.textContent = '↕';
      }
      sortButton.appendChild(arrow);

      th.addEventListener('click', () => {
        if (sortCol === col.key) {
          sortAsc = !sortAsc;
        } else {
          sortCol = col.key;
          sortAsc = col.key === 'name';
        }
        renderTable();
        tableContainer.querySelector(`[data-sort-col="${col.key}"]`).focus();
      });

      headerRow.appendChild(th);
    });

    thead.appendChild(headerRow);
    table.appendChild(thead);

    // Body
    const tbody = document.createElement('tbody');

    if (data.length === 0) {
      const emptyRow = document.createElement('tr');
      const emptyTd = document.createElement('td');
      emptyTd.colSpan = 6;
      emptyTd.style.textAlign = 'center';
      emptyTd.style.padding = 'var(--space-6)';
      emptyTd.style.color = 'var(--color-ash)';
      emptyTd.textContent = 'No conditions match the current filters.';
      emptyRow.appendChild(emptyTd);
      tbody.appendChild(emptyRow);
    } else {
      data.forEach(cond => {
        const row = document.createElement('tr');
        row.style.cursor = 'pointer';
        row.addEventListener('click', () => {
          window.location.hash = `#/conditions/${cond.slug}`;
        });

        // Condition name
        const nameTd = document.createElement('td');
        const nameLink = document.createElement('a');
        nameLink.href = `#/conditions/${cond.slug}`;
        nameLink.className = 'data-table__condition-link';
        nameLink.textContent = conditionDisplayName(cond);
        nameLink.addEventListener('click', e => e.stopPropagation());
        nameTd.appendChild(nameLink);
        row.appendChild(nameTd);

        // Gap type badge
        const gapTd = document.createElement('td');
        gapTd.appendChild(createGapTypeBadge(cond.gapType, { size: 'small' }));
        row.appendChild(gapTd);

        // % Women
        const womenTd = document.createElement('td');
        womenTd.className = 'data-md';
        womenTd.textContent = `${cond.metrics.studiesIncludingWomen.percent}%`;
        row.appendChild(womenTd);

        // % Sex-disaggregated
        const disaggTd = document.createElement('td');
        disaggTd.className = 'data-md';
        disaggTd.textContent = `${cond.metrics.sexDisaggregated.percent}%`;
        row.appendChild(disaggTd);

        // Evidence quality
        const eqTd = document.createElement('td');
        eqTd.appendChild(createEvidenceQuality(cond.metrics.evidenceQuality, { size: 'small' }));
        row.appendChild(eqTd);

        // Score
        const scoreTd = document.createElement('td');
        scoreTd.className = 'data-md';
        scoreTd.style.fontWeight = '600';
        scoreTd.textContent = cond.metrics.representationScore;
        row.appendChild(scoreTd);

        row.querySelectorAll('td').forEach((cell, index) => { cell.dataset.label = columns[index].label; });
        tbody.appendChild(row);
      });
    }

    table.appendChild(tbody);
    scrollContainer.appendChild(table);
    tableContainer.appendChild(scrollContainer);
  }

  renderTable();

  // ── 5. Gap Type Legend ──
  const legend = document.createElement('div');
  legend.className = 'gap-legend';

  [1, 2, 3, 4].forEach(type => {
    const item = document.createElement('div');
    item.className = 'gap-legend__item';
    item.appendChild(createGapTypeBadge(type, { size: 'small' }));

    const desc = document.createElement('span');
    desc.textContent = GAP_TYPE_DESCRIPTIONS[type];
    item.appendChild(desc);

    legend.appendChild(item);
  });

  const legendDetails = document.createElement('details');
  legendDetails.className = 'gap-legend-details';
  const legendSummary = document.createElement('summary');
  legendSummary.textContent = 'Understand the gap types';
  legendDetails.appendChild(legendSummary);
  legendDetails.appendChild(legend);
  wrapper.insertBefore(legendDetails, tableContainer);

  // ── 6. Index Note ──
  const note = document.createElement('p');
  note.className = 'gap-index__note';
  note.textContent = 'This index reflects manually curated data. Automated analysis is in development. Last updated: March 2025.';
  wrapper.appendChild(note);

  page.appendChild(wrapper);
  container.appendChild(page);
}

/**
 * Route definitions for the Verity SPA.
 * Each route has a pattern (regex) and a handler function.
 */
const routes = [
  {
    pattern: /^#?\/?$/,
    title: 'Verity — Research Transparency Platform',
    handler: (main) => renderHomePage(main),
  },
  {
    pattern: /^#?\/conditions\/([a-z0-9-]+)\/?$/,
    title: null, // Set dynamically from condition name
    handler: (main, match) => {
      const slug = match[1];
      const condition = getConditionBySlug(slug);
      if (condition) {
        document.title = `${conditionDisplayName(condition)} — Verity`;
        renderConditionPage(main, condition);
      } else {
        document.title = 'Not Found — Verity';
        renderNotFoundPage(main);
      }
    },
  },
  {
    pattern: /^#?\/gap-index\/?$/,
    title: 'Gap Index — Verity',
    handler: (main) => renderGapIndexPage(main),
  },
  {
    pattern: /^#?\/about\/?$/,
    title: 'About — Verity',
    handler: (main) => renderAboutPage(main),
  },
];

/**
 * Resolve the current hash to a route and render it.
 */
function resolveRoute() {
  if (verityDotsCleanup) verityDotsCleanup();
  const hash = window.location.hash || '#/';
  const main = document.getElementById('main-content');

  if (!main) return;

  // Try each route pattern
  for (const route of routes) {
    const match = hash.match(route.pattern);
    if (match) {
      if (route.title) {
        document.title = route.title;
      }
      route.handler(main, match);
      postRouteSetup();
      return;
    }
  }

  // No match — render 404
  document.title = 'Not Found — Verity';
  renderNotFoundPage(main);
  postRouteSetup();
}

/**
 * Tasks to run after every route change:
 * - Scroll to top
 * - Set up Intersection Observer for fade-in sections
 * - Update navbar active state
 */
function postRouteSetup() {
  window.scrollTo({ top: 0, behavior: 'instant' });
  setupFadeInSections();
  const main = document.getElementById('main-content');
  if (main && !window.matchMedia('(prefers-reduced-motion: reduce)').matches && main.animate) {
    main.animate([{ opacity: 0.88 }, { opacity: 1 }], { duration: 140, easing: 'ease-out' });
  }
}

/**
 * Set up Intersection Observer for `.fade-in-section` elements.
 * Respects prefers-reduced-motion by applying `.visible` immediately.
 */
function setupFadeInSections() {
  const sections = document.querySelectorAll('.fade-in-section');
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (prefersReducedMotion) {
    sections.forEach((section) => section.classList.add('visible'));
    return;
  }

  const observer = new IntersectionObserver(
    (entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    },
    { threshold: 0.01, rootMargin: '0px 0px -20px 0px' }
  );

  sections.forEach((section) => observer.observe(section));
}

/**
 * Attach scroll listener to toggle `.scrolled` class on the navbar.
 * Adds a subtle border when the user scrolls past 10px.
 */
function setupNavbarScrollBehavior() {
  const navbar = document.getElementById('navbar');
  if (!navbar) return;

  let ticking = false;

  window.addEventListener('scroll', () => {
    if (!ticking) {
      window.requestAnimationFrame(() => {
        if (window.scrollY > 10) {
          navbar.classList.add('scrolled');
        } else {
          navbar.classList.remove('scrolled');
        }
        ticking = false;
      });
      ticking = true;
    }
  }, { passive: true });
}

/**
 * Navigate programmatically to a given hash route.
 * @param {string} hash — e.g. '#/' or '#/conditions/adhd'
 */
function navigateTo(hash) {
  window.location.hash = hash;
}

/**
 * Initialize the application.
 */
function init() {
  const navbarContainer = document.getElementById('navbar');
  const footerContainer = document.getElementById('footer');

  renderNavbar(navbarContainer);
  renderFooter(footerContainer);

  // Listen for hash changes
  window.addEventListener('hashchange', resolveRoute);

  // Set up navbar scroll behavior
  setupNavbarScrollBehavior();

  // Handle the initial route
  resolveRoute();
}

// Boot when DOM is ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>

<script>
(function () {
  'use strict';

  const FALLBACK_MESSAGE =
    "Sorry, I'm having trouble connecting right now. In the meantime, you can browse conditions from the Gap Index, or reach us at verityprojectinfo@gmail.com.";
  const WELCOME_MESSAGE =
    "Hi! I can help you find a condition's representation score, explain how Verity works, or point you to the right place to reach out. What would you like to know?";

  let conversation = [];
  let isSending = false;

  const bubble = document.getElementById('verity-chatbot-bubble');
  const iconChat = document.getElementById('verity-chatbot-icon-chat');
  const iconClose = document.getElementById('verity-chatbot-icon-close');
  const chatWindow = document.getElementById('verity-chatbot-window');
  const messagesEl = document.getElementById('verity-chatbot-messages');
  const form = document.getElementById('verity-chatbot-form');
  const input = document.getElementById('verity-chatbot-input');
  const sendBtn = document.getElementById('verity-chatbot-send');
  const closeBtn = document.getElementById('verity-chatbot-close');

  if (!bubble || !chatWindow) return;

  let hasOpenedOnce = false;

  function toggleChat() {
    const willOpen = !chatWindow.classList.contains('is-open');
    chatWindow.classList.toggle('is-open', willOpen);
    bubble.setAttribute('aria-expanded', String(willOpen));
    if (iconChat) iconChat.style.display = willOpen ? 'none' : 'block';
    if (iconClose) iconClose.style.display = willOpen ? 'block' : 'none';

    if (willOpen) {
      if (input) input.focus();
      if (!hasOpenedOnce) {
        hasOpenedOnce = true;
        addMessage('assistant', WELCOME_MESSAGE);
      }
    }
  }

  function closeChat() {
    chatWindow.classList.remove('is-open');
    bubble.setAttribute('aria-expanded', 'false');
    if (iconChat) iconChat.style.display = 'block';
    if (iconClose) iconClose.style.display = 'none';
    bubble.focus();
  }

  chatWindow.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && chatWindow.classList.contains('is-open')) closeChat();
  });

  bubble.addEventListener('click', toggleChat);
  if (closeBtn) closeBtn.addEventListener('click', closeChat);

  function renderMessageHTML(text) {
    const escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return escaped.replace(/(https:\/\/verityproject\.xyz[^\s)]*)/g, (url) => {
      const hashIndex = url.indexOf('#');
      const href = hashIndex !== -1 ? url.slice(hashIndex) : url;
      return `<a href="${href}">${url}</a>`;
    });
  }

  function addMessage(role, text) {
    const el = document.createElement('div');
    el.className = `verity-msg verity-msg--${role === 'user' ? 'user' : 'bot'}`;
    el.innerHTML = renderMessageHTML(text);
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTypingIndicator() {
    const el = document.createElement('div');
    el.className = 'verity-msg verity-msg--bot verity-msg--typing';
    el.id = 'verity-chatbot-typing';
    el.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTypingIndicator() {
    const el = document.getElementById('verity-chatbot-typing');
    if (el) el.remove();
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || isSending) return;

    addMessage('user', text);
    input.value = '';
    setSending(true);
    showTypingIndicator();

    try {
      const response = await fetch('/api/chatbot', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history: conversation }),
      });

      removeTypingIndicator();

      if (!response.ok) {
        addMessage('assistant', FALLBACK_MESSAGE);
        setSending(false);
        return;
      }

      const data = await response.json();
      const reply = data.reply || FALLBACK_MESSAGE;
      addMessage('assistant', reply);
      conversation.push({ role: 'user', content: text });
      conversation.push({ role: 'assistant', content: reply });
    } catch (err) {
      removeTypingIndicator();
      addMessage('assistant', FALLBACK_MESSAGE);
    } finally {
      setSending(false);
    }
  });

  function setSending(sending) {
    isSending = sending;
    input.disabled = sending;
    sendBtn.disabled = sending;
  }
})();
</script>
